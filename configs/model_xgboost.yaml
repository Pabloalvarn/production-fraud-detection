extends: base.yaml
model:
  name: xgboost
  sampling: none
  parameters:
    n_estimators: 350
    max_depth: 6
    learning_rate: 0.05
    min_child_weight: 3
    subsample: 0.85
    colsample_bytree: 0.85
    reg_alpha: 0.0
    reg_lambda: 1.0
    tree_method: hist
    eval_metric: logloss
    n_jobs: -1

