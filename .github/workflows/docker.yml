name: Docker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - pyproject.toml
      - src/**
      - configs/**
      - .github/workflows/docker.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build container
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: production-fraud-detection:test

