[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "production-fraud-detection"
version = "0.1.0"
description = "Production-oriented rare-event fraud detection with temporal validation and cost-sensitive decisions."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "Pablo Álvarez Arnedo" }]
dependencies = [
  "fastapi>=0.115,<1",
  "imbalanced-learn>=0.13,<1",
  "joblib>=1.4,<2",
  "matplotlib>=3.9,<4",
  "mlflow>=3,<4",
  "numpy>=2,<3",
  "pandas>=2.2,<4",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "pyyaml>=6,<7",
  "scikit-learn>=1.6,<2",
  "scipy>=1.14,<2",
  "seaborn>=0.13,<1",
  "shap>=0.46,<1",
  "uvicorn[standard]>=0.32,<1",
  "xgboost>=2.1,<4",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "ipykernel>=6.29,<8",
  "jupyterlab>=4.3,<5",
  "mypy>=1.13,<2",
  "nbformat>=5.10,<6",
  "pre-commit>=4,<5",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.8,<1",
]

[project.scripts]
fraud-download = "fraud_detection.data.download:main"
fraud-validate = "fraud_detection.data.validation:main"
fraud-train = "fraud_detection.models.train:main"
fraud-monitor = "fraud_detection.monitoring.drift:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fraud_detection"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

